app:
  name: easy-note
  environment: local

logger:
  cores:
    - name: console
      level: debug
      encoding: console
      output: stdout
      time_format: utc

    - name: json
      level: debug
      encoding: json
      output: file
      path: ./logs/easy.log
      time_format: utc

scheduler:
  cache_window: 24h
  poll_interval: 1m
  lock_timeout: 1m
  max_attempts: 5

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: notes
  ssl_mode: disable
