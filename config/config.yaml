app:
  name: easy-note
  environment: local

logger:
  cores:
    - name: console
      level: debug
      encoding: console
      output: stdout
      time_format: utc

    - name: json
      level: debug
      encoding: json
      output: file
      path: ./logs/easy.log
      time_format: utc

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: notes
  ssl_mode: disable