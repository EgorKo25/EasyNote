app:
  name: easy-note
  environment: local

logger:
  cores:
    - name: console
      level: debug
      encoding: console
      output: stdout
      time_format: utc

    - name: json
      level: debug
      encoding: json
      output: file
      path: ./logs/easy.log
      time_format: utc

scheduler:
  cache_window: 24h
  poll_interval: 1m
  batch_limit: 50
  max_attempts: 5

telegram:
  token_env: TELEGRAM_BOT_TOKEN
  api_base_url: https://api.telegram.org
  request_timeout: 10s
  debug_mode: false
  warnings: true
  health_check: false
  long_polling_buffer: 100
  long_polling_interval: 0s
  long_polling_retry: 8s
  parse_mode: ""
  disable_notification: false
  protect_content: false

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: notes
  ssl_mode: disable
  migration_dialect: postgres
  max_conns: 4
  min_conns: 0
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m
  health_check_period: 1m
