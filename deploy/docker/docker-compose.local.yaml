services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/EasyNote.Dockerfile
      args:
        APP_TARGET: ./cmd/backend
    image: easynote:local
    pull_policy: build
    container_name: easy-note-local-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENVIRONMENT: local
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TZ: ${TZ:-Europe/Moscow}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-app,localhost,127.0.0.1,postgres,easy-note-local-postgres}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-app,localhost,127.0.0.1,postgres,easy-note-local-postgres}

      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: ${POSTGRES_DB:-notes}
      DATABASE_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_HOST_PORT:-8080}:8080"
    volumes:
      - easy_note_local_logs:/app/logs

  telegram-ui:
    build:
      context: ../..
      dockerfile: deploy/docker/EasyNote.Dockerfile
      args:
        APP_TARGET: ./cmd/telegram-ui
    image: easynote-telegram-ui:local
    pull_policy: build
    container_name: easy-note-local-telegram-ui
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENVIRONMENT: local
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_BACKEND_BASE_URL: http://app:8080
      TZ: ${TZ:-Europe/Moscow}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-app,localhost,127.0.0.1}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-app,localhost,127.0.0.1}
    depends_on:
      app:
        condition: service_started
    volumes:
      - easy_note_local_logs:/app/logs

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: easy-note-local-swagger-ui
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /openapi.yaml
    ports:
      - "${SWAGGER_HOST_PORT:-8081}:8080"
    volumes:
      - ../../docs/openapi.yaml:/openapi.yaml:ro

  postgres:
    image: postgres:16-alpine
    container_name: easy-note-local-postgres
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - easy_note_local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-notes}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  easy_note_local_postgres_data:
  easy_note_local_logs:
