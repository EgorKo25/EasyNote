services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/EasyNote.Dockerfile
    image: easynote:local
    container_name: easy-note-local-app
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      APP_ENVIRONMENT: local
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_USER_TIMEZONE: ${TELEGRAM_USER_TIMEZONE:-Europe/Moscow}
      TZ: ${TZ:-Europe/Moscow}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-}

      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: ${POSTGRES_DB:-notes}
      DATABASE_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - easy_note_local_logs:/app/logs

  postgres:
    image: postgres:16-alpine
    container_name: easy-note-local-postgres
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - easy_note_local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-notes}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  easy_note_local_postgres_data:
  easy_note_local_logs:
