name: CI

on:
  pull_request:

permissions:
  contents: read
  issues: write
  packages: write
  pull-requests: write

env:
  GO_VERSION_FILE: go.mod
  GOLANGCI_LINT_VERSION: v2.11
  APP_NAME: easynote

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Read application version
        id: version
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CHANGELIST.md | head -n 1)"
          if [ -z "$version" ]; then
            echo "CHANGELIST.md must start with: version: MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build application
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/${APP_NAME} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: dist/${{ env.APP_NAME }}
          if-no-files-found: error
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Run golangci-lint
        id: golangci-lint
        uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Open PR discussion for lint failure
        if: steps.golangci-lint.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                'golangci-lint failed for this pull request.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Please check the lint job logs and fix findings from the repository golangci configuration.'
              ].join('\n')
            });

      - name: Fail lint job
        if: steps.golangci-lint.outcome == 'failure'
        run: exit 1

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Run unit tests
        run: go test ./...

  dockerize:
    name: dockerize
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Read application version
        id: version
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CHANGELIST.md | head -n 1)"
          if [ -z "$version" ]; then
            echo "CHANGELIST.md must start with: version: MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}-pr-${{ github.event.pull_request.number }}
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
