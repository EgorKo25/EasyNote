services:
  mihomo:
    image: metacubex/mihomo:latest
    container_name: mihomo
    restart: unless-stopped
    volumes:
      - /opt/mihomo:/root/.config/mihomo
    networks:
      - easy-note-net
  app:
    image: ${APP_IMAGE:-easynote:local}
    container_name: easy-note-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TZ: ${TZ:-Europe/Moscow}
      HTTP_PROXY: "http://mihomo:7890"
      HTTPS_PROXY: "http://mihomo:7890"
      http_proxy: "http://mihomo:7890"
      https_proxy: "http://mihomo:7890"
      NO_PROXY: "localhost,127.0.0.1,postgres,db,easy-note-postgres"
      no_proxy: "localhost,127.0.0.1,postgres,db,easy-note-postgres"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: ${POSTGRES_DB:-notes}
      DATABASE_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - easy_note_logs:/app/logs

  postgres:
    image: postgres:16-alpine
    container_name: easy-note-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - easy_note_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-notes}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  easy_note_postgres_data:
  easy_note_logs:

networks:
  easy-note-net: